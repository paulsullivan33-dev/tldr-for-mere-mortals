site_name: tldr for Mere Mortals
site_description: A pocket cheat sheet for almost every command line tool. Community-written pages that boil the man page down to the common examples, how a client like Tealdeer fetches and renders them, how to write pages for your own scripts, and when the man page is still the right answer.
site_url: https://paulsullivan33-dev.github.io/tldr-for-mere-mortals/
